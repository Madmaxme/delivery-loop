specversion: "1.0"
id: ledger-reconcile
effect: data-only
purpose: Describes a comparison of recorded run events with runs a client can already see.
trigger:
  kind: schedule
  spec: Described as a periodic comparison. This file does not register a schedule.
inputs:
  - name: events
    source: ref:run-events
  - name: runs
    source: ref:observed-runs
output:
  event: bot.routine.ledger-reconcile.reported
  contract: Each compared run is matched, missing, or extra. No status is written.
idempotency: One report per comparison window and input set.
overlap: queue
approval:
  boundary: A report of differences. No status write and no dispatch.
  requires: A person approves any live schedule. This file does not register one.
