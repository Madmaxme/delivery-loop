specversion: "1.0"
id: proactive-check
effect: data-only
purpose: Describes a check of runs that are already open. It does not start a run.
trigger:
  kind: schedule
  spec: Described as a periodic read of existing runs. This file does not register a schedule and does not start a sweep.
inputs:
  - name: runs
    source: ref:open-runs
output:
  event: bot.routine.proactive-check.reported
  contract: Each open run and the evidence already attached to it.
idempotency: One report per run set and window.
overlap: skip
approval:
  boundary: Reading existing runs. No dispatch, no resume, and no ground compile.
  requires: A person approves any live schedule. This file does not register one.
