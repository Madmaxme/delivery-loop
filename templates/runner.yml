name: Delivery loop

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Ticket id. Required except for sweep.
        required: false
        type: string
        default: ""
      mode:
        description: sweep, deliver, or ship
        required: true
        type: choice
        options:
          - sweep
          - deliver
          - ship

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  delivery-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Pack prepare
        run: |
          if [ -x scripts/delivery-loop-prepare.sh ]; then
            bash scripts/delivery-loop-prepare.sh
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the loop
        env:
          GITHUB_ACTIONS: "true"
          DELIVERY_LOOP_RUNTIME: local
          DELIVERY_LOOP_DEPLOY_KEY: ${{ secrets.DELIVERY_LOOP_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          DEST="$(mktemp -d)"
          if [ -n "${DELIVERY_LOOP_DEPLOY_KEY:-}" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$DELIVERY_LOOP_DEPLOY_KEY" > ~/.ssh/delivery-loop
            chmod 600 ~/.ssh/delivery-loop
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
            GIT_SSH_COMMAND="ssh -i ~/.ssh/delivery-loop -o IdentitiesOnly=yes" \
              git clone --depth 1 git@github.com:Madmaxme/delivery-loop.git "$DEST/delivery-loop"
          else
            git clone --depth 1 "https://github.com/Madmaxme/delivery-loop.git" "$DEST/delivery-loop"
          fi
          npm install -g "$DEST/delivery-loop"
          if [ "${{ inputs.mode }}" = "sweep" ]; then
            delivery-loop sweep
          elif [ "${{ inputs.mode }}" = "ship" ]; then
            delivery-loop ship ${{ inputs.issue }}
          else
            delivery-loop deliver ${{ inputs.issue }}
          fi
