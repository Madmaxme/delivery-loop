name: Delivery loop

on:
  schedule:
    - cron: "0 * * * *"
  repository_dispatch:
    types: [ship-continue]
  workflow_dispatch:
    inputs:
      issue:
        description: Ticket id. Required except for audit or sweep.
        required: false
        type: string
        default: ""
      project:
        description: Optional project scope for audit or sweep.
        required: false
        type: string
        default: ""
      mode:
        description: audit, sweep, deliver, or ship
        required: true
        type: choice
        options:
          - audit
          - sweep
          - deliver
          - ship
      ship_action:
        description: ship, continue the active ship stage, or sweep
        required: false
        type: choice
        options:
          - ship
          - continue
          - sweep
        default: ship

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  delivery-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pack prepare
        run: |
          if [ "${{ inputs.mode }}" != "audit" ] && [ -x scripts/delivery-loop-prepare.sh ]; then
            bash scripts/delivery-loop-prepare.sh
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the loop
        env:
          GITHUB_ACTIONS: "true"
          DELIVERY_LOOP_RUN_ID: ${{ github.run_id }}
          DELIVERY_LOOP_PROJECT: ${{ inputs.project }}
          DELIVERY_LOOP_ISSUE: ${{ inputs.issue }}
          DELIVERY_LOOP_RUNTIME: local
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Prints an installation token. runner.identity mint requires it for every forge call.
          DELIVERY_LOOP_GITHUB_MINT: ${{ inputs.mode != 'audit' && vars.DELIVERY_LOOP_GITHUB_MINT || '' }}
          DELIVERY_LOOP_ENGINE_REPOSITORY: ${{ vars.DELIVERY_LOOP_ENGINE_REPOSITORY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CURSOR_API_KEY: ${{ inputs.mode != 'audit' && secrets.CURSOR_API_KEY || '' }}
          # Second cursor key slot. An empty secret leaves the launch on the primary slot.
          CURSOR_API_KEY_FALLBACK: ${{ inputs.mode != 'audit' && secrets.CURSOR_API_KEY_FALLBACK || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.mode != 'audit' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.mode != 'audit' && secrets.OPENAI_API_KEY || '' }}
          # Empty URL writes the event file and does not post.
          # The header is one line from the client's own store.
          # REQUIRED true or 1 fails the run when the post fails.
          DELIVERY_LOOP_EVENT_URL: ${{ vars.DELIVERY_LOOP_EVENT_URL }}
          DELIVERY_LOOP_EVENT_HEADER: ${{ secrets.DELIVERY_LOOP_EVENT_HEADER }}
          DELIVERY_LOOP_EVENT_REQUIRED: ${{ vars.DELIVERY_LOOP_EVENT_REQUIRED }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)/delivery-loop"
          git clone --depth 1 --branch __DELIVERY_LOOP_REF__ "https://github.com/${DELIVERY_LOOP_ENGINE_REPOSITORY}.git" "$dir"
          event_failed=0
          if [ "${{ inputs.mode }}" != "audit" ]; then
            bash "$dir/scripts/run-event.sh" started || event_failed=1
          fi
          code=0
          if [ "$event_failed" -eq 0 ]; then
            set +e
            (cd "$dir" && npm install --omit=dev --ignore-scripts)
            code=$?
            if [ "$code" -eq 0 ]; then
              npm install -g "$dir"
              code=$?
            fi
            if [ "$code" -eq 0 ]; then
              if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
                delivery-loop ship sweep
              elif [ "${{ inputs.mode }}" = "audit" ]; then
                if [ -n "$DELIVERY_LOOP_PROJECT" ]; then
                  delivery-loop audit --project "$DELIVERY_LOOP_PROJECT"
                else
                  delivery-loop audit
                fi
              elif [ "${{ inputs.mode }}" = "sweep" ]; then
                if [ -n "$DELIVERY_LOOP_PROJECT" ]; then
                  delivery-loop sweep --project "$DELIVERY_LOOP_PROJECT"
                else
                  delivery-loop sweep
                fi
              elif [ "${{ inputs.mode }}" = "ship" ]; then
                if [ "${{ inputs.ship_action }}" = "continue" ]; then
                  delivery-loop ship continue "$DELIVERY_LOOP_ISSUE"
                elif [ "${{ inputs.ship_action }}" = "sweep" ]; then
                  delivery-loop ship sweep
                else
                  delivery-loop ship "$DELIVERY_LOOP_ISSUE"
                fi
              else
                delivery-loop deliver ${{ inputs.issue }}
              fi
              code=$?
            fi
            set -e
          fi
          if [ "$event_failed" -ne 0 ] || [ "$code" -ne 0 ]; then
            event_status=failure
          else
            event_status=success
          fi
          if [ "${{ inputs.mode }}" != "audit" ]; then
            bash "$dir/scripts/run-event.sh" finished "$event_status" || event_failed=1
          fi
          if [ "$event_failed" -ne 0 ]; then
            exit 1
          fi
          exit "$code"
      - name: Upload run events
        if: ${{ always() && inputs.mode != 'audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: delivery-loop-run-events
          path: .delivery-loop/events/
          if-no-files-found: warn
          include-hidden-files: true
