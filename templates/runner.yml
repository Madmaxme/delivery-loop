name: Delivery loop

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Ticket id. Required except for sweep.
        required: false
        type: string
        default: ""
      mode:
        description: sweep, deliver, or ship
        required: true
        type: choice
        options:
          - sweep
          - deliver
          - ship

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  delivery-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Pack prepare
        run: |
          if [ -x scripts/delivery-loop-prepare.sh ]; then
            bash scripts/delivery-loop-prepare.sh
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the loop
        env:
          GITHUB_ACTIONS: "true"
          DELIVERY_LOOP_RUNTIME: local
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Both are present so the step can keep only the one the trusted commit selected.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_OAUTH_CLIENT_ID: ${{ secrets.LINEAR_OAUTH_CLIENT_ID }}
          LINEAR_OAUTH_CLIENT_SECRET: ${{ secrets.LINEAR_OAUTH_CLIENT_SECRET }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Empty URL writes the event file and does not post.
          # The header is one line from the client's own store.
          # REQUIRED true or 1 fails the run when the post fails.
          DELIVERY_LOOP_EVENT_URL: ${{ vars.DELIVERY_LOOP_EVENT_URL }}
          DELIVERY_LOOP_EVENT_HEADER: ${{ secrets.DELIVERY_LOOP_EVENT_HEADER }}
          DELIVERY_LOOP_EVENT_REQUIRED: ${{ vars.DELIVERY_LOOP_EVENT_REQUIRED }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)/delivery-loop"
          git clone --depth 1 --branch __DELIVERY_LOOP_REF__ https://github.com/Madmaxme/delivery-loop.git "$dir"
          event_failed=0
          bash "$dir/scripts/run-event.sh" started || event_failed=1
          code=0
          if [ "$event_failed" -eq 0 ]; then
            set +e
            (cd "$dir" && npm install --omit=dev --ignore-scripts)
            code=$?
            if [ "$code" -eq 0 ]; then
              npm install -g "$dir"
              code=$?
            fi
            if [ "$code" -eq 0 ]; then
              pack="$(git show HEAD:delivery-loop.yaml 2>/dev/null || true)"
              if printf '%s' "$pack" | (cd "$dir" && node --import tsx -e 'import { botsPathFromPackYaml } from "./src/cli/trusted-config.ts"; import { readFileSync } from "node:fs"; process.exit(botsPathFromPackYaml(readFileSync(0, "utf8")) ? 0 : 1);'); then
                unset LINEAR_API_KEY
              else
                unset LINEAR_OAUTH_CLIENT_ID LINEAR_OAUTH_CLIENT_SECRET
              fi
              if [ "${{ inputs.mode }}" = "sweep" ]; then
                delivery-loop sweep
              elif [ "${{ inputs.mode }}" = "ship" ]; then
                delivery-loop ship ${{ inputs.issue }}
              else
                delivery-loop deliver ${{ inputs.issue }}
              fi
              code=$?
            fi
            set -e
          fi
          if [ "$event_failed" -ne 0 ] || [ "$code" -ne 0 ]; then
            event_status=failure
          else
            event_status=success
          fi
          bash "$dir/scripts/run-event.sh" finished "$event_status" || event_failed=1
          if [ "$event_failed" -ne 0 ]; then
            exit 1
          fi
          exit "$code"
      - name: Upload run events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-loop-run-events
          path: .delivery-loop/events/
          if-no-files-found: warn
          include-hidden-files: true
