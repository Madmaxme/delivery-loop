name: Delivery loop

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Ticket id. Required except for sweep.
        required: false
        type: string
        default: ""
      mode:
        description: sweep, deliver, or ship
        required: true
        type: choice
        options:
          - sweep
          - deliver
          - ship

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  delivery-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Pack prepare
        run: |
          if [ -x scripts/delivery-loop-prepare.sh ]; then
            bash scripts/delivery-loop-prepare.sh
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the loop
        env:
          GITHUB_ACTIONS: "true"
          DELIVERY_LOOP_RUNTIME: local
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LEDGER_WEBHOOK_URL: ${{ secrets.LEDGER_WEBHOOK_URL }}
          LEDGER_WEBHOOK_AUTH: ${{ secrets.LEDGER_WEBHOOK_AUTH }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)/delivery-loop"
          git clone --depth 1 --branch __DELIVERY_LOOP_REF__ https://github.com/Madmaxme/delivery-loop.git "$dir"
          # Optional. An empty LEDGER_WEBHOOK_URL skips both writes, so a client
          # without the secret is unchanged. A set URL fail-closes before the loop.
          ledger() {
            if [ -z "${LEDGER_WEBHOOK_URL:-}" ]; then
              return 0
            fi
            bash "$dir/scripts/ledger-report.sh" "$@"
          }
          ledger_failed=0
          ledger started other || ledger_failed=1
          code=0
          if [ "$ledger_failed" -eq 0 ]; then
            set +e
            (cd "$dir" && npm install --omit=dev --ignore-scripts)
            code=$?
            if [ "$code" -eq 0 ]; then
              npm install -g "$dir"
              code=$?
            fi
            if [ "$code" -eq 0 ]; then
              if [ "${{ inputs.mode }}" = "sweep" ]; then
                delivery-loop sweep
              elif [ "${{ inputs.mode }}" = "ship" ]; then
                delivery-loop ship ${{ inputs.issue }}
              else
                delivery-loop deliver ${{ inputs.issue }}
              fi
              code=$?
            fi
            set -e
          fi
          if [ "$ledger_failed" -ne 0 ] || [ "$code" -ne 0 ]; then
            ledger_status=failure
          else
            ledger_status=success
          fi
          ledger finished other "$ledger_status" || ledger_failed=1
          if [ "$ledger_failed" -ne 0 ]; then
            exit 1
          fi
          exit "$code"
