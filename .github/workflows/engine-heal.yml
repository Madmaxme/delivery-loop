# Waits until pull_request quality is green on an engine-heal pull request,
# squash-merges, and tags the merge commit. The opener already committed the
# version bump. This workflow does not push a commit. A missing bump gets a comment.
# No review and no manual approval. See METHODOLOGY.md.
# It also writes a run event file at the start and at the finish and uploads
# those files. It does not post them.

name: engine-heal

on:
  workflow_run:
    workflows: ["quality"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: engine-heal-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record the run start
        run: bash scripts/run-event.sh started
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Merge when pull_request quality is green and tag the merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAL_EVENT: ${{ github.event.workflow_run.event }}
          HEAL_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAL_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAL_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAL_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAL_BASE_REPO: ${{ github.repository }}
        run: npx tsx scripts/engine-heal.ts
      - name: Record the run finish
        if: always()
        run: bash scripts/run-event.sh finished "${{ job.status }}"
      - name: Upload run events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-loop-run-events
          path: .delivery-loop/events/
          if-no-files-found: warn
          include-hidden-files: true
