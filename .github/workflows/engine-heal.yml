# Commits the next patch onto an engine-heal pull request, waits until quality
# is green on that tip, squash-merges, and tags the merge commit.
# It does not push a commit to main. A push from this token does not start
# on: push workflows, so the job starts quality with workflow_dispatch and waits.
# No review and no manual approval. See METHODOLOGY.md.

name: engine-heal

on:
  workflow_run:
    workflows: ["quality"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: engine-heal-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Bump the pull request, merge when quality is green, and tag the merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAL_EVENT: ${{ github.event.workflow_run.event }}
          HEAL_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAL_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAL_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAL_BASE_REPO: ${{ github.repository }}
        run: npx tsx scripts/engine-heal.ts
