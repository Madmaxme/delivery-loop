specversion: "1.0"
role: orchestrator
effect: data-only
identityRef: ref:orchestrator
purpose: Monitors existing delivery runs and reports evidence.
policies:
  - orchestrator-no-dispatch
  - orchestrator-no-status-writes
authority:
  may:
    - id: monitor-runs
      statement: Monitor existing delivery runs
    - id: report-evidence
      statement: Report evidence from those runs
  mustNot:
    - id: orchestrator-no-dispatch
      statement: Start, dispatch, re-dispatch, resume, or run the delivery loop, including a scheduled sweep and a ground-only compile
    - id: orchestrator-no-status-writes
      statement: Write a delivery status or a delivery label
