specversion: "1.0"
role: delivery-agent
effect: data-only
identityRef: ref:delivery-agent
purpose: The harness execution agent. It thinks, then calls the forge, tracker, worker, and connector adapters. A GitHub App or other execution identity is a tool this role calls. It is not a bot. Loading this file does not start the loop.
tools:
  - ref: ref:forge-open-pull-request
    adapter: forge
    operation: openPullRequest
  - ref: ref:forge-quality
    adapter: forge
    operation: quality
  - ref: ref:forge-design-check
    adapter: forge
    operation: designCheck
  - ref: ref:forge-request-quality-run
    adapter: forge
    operation: requestQualityRun
  - ref: ref:forge-mergeability
    adapter: forge
    operation: mergeability
  - ref: ref:forge-compare
    adapter: forge
    operation: compare
  - ref: ref:forge-update-branch
    adapter: forge
    operation: updateBranch
  - ref: ref:forge-squash-merge
    adapter: forge
    operation: squashMerge
  - ref: ref:forge-dispatch
    adapter: forge
    operation: dispatch
  - ref: ref:tracker-list-intake
    adapter: tracker
    operation: listIntake
  - ref: ref:tracker-get
    adapter: tracker
    operation: get
  - ref: ref:tracker-comment
    adapter: tracker
    operation: comment
  - ref: ref:tracker-set-state
    adapter: tracker
    operation: setState
  - ref: ref:tracker-add-label
    adapter: tracker
    operation: addLabel
  - ref: ref:tracker-remove-label
    adapter: tracker
    operation: removeLabel
  - ref: ref:tracker-project-snapshot
    adapter: tracker
    operation: projectSnapshot
  - ref: ref:worker-start
    adapter: worker
    operation: start
  - ref: ref:worker-join
    adapter: worker
    operation: join
  - ref: ref:connector-sentry
    adapter: connector
    operation: sentry
  - ref: ref:connector-posthog
    adapter: connector
    operation: posthog
  - ref: ref:connector-stripe
    adapter: connector
    operation: stripe
  - ref: ref:connector-figma
    adapter: connector
    operation: figma
  - ref: ref:connector-database
    adapter: connector
    operation: database
identities:
  - ref: ref:forge-github
    kind: execution
    adapter: forge
    purpose: ForgeAdapter for pull requests. An app that opens a pull request or pushes a head is this execution identity, not a bot.
  - ref: ref:forge-git
    kind: execution
    adapter: forge
    purpose: ForgeAdapter that merges with git on any remote.
  - ref: ref:tracker-linear
    kind: execution
    adapter: tracker
    purpose: TrackerAdapter for the shared work queue.
  - ref: ref:tracker-github
    kind: execution
    adapter: tracker
    purpose: TrackerAdapter for a GitHub Issues queue.
  - ref: ref:worker-cursor
    kind: worker
    adapter: worker
    purpose: WorkerAdapter start and join. Kind cursor. A login value is not stored in this file.
  - ref: ref:worker-claude
    kind: worker
    adapter: worker
    purpose: WorkerAdapter start and join. Kind claude. A login value is not stored in this file.
  - ref: ref:worker-codex
    kind: worker
    adapter: worker
    purpose: WorkerAdapter start and join. Kind codex. A login value is not stored in this file.
  - ref: ref:worker-copilot
    kind: worker
    adapter: worker
    purpose: WorkerAdapter start and join. Kind copilot. A login value is not stored in this file.
  - ref: ref:worker-http
    kind: worker
    adapter: worker
    purpose: WorkerAdapter start and join. Kind http. A login value is not stored in this file.
  - ref: ref:runner-gha
    kind: runner
    adapter: runner
    purpose: The process that stays awake and runs commands. Kind gha.
  - ref: ref:runner-local
    kind: runner
    adapter: runner
    purpose: The process that stays awake and runs commands. Kind local.
  - ref: ref:commit-actor
    kind: commit-actor
    adapter: forge
    purpose: commitActorLogin refuses a write unless the authenticated login is the actor named for that repo. This file stores the reference, not the login.
  - ref: ref:merge-review
    kind: review
    adapter: forge
    purpose: Reads quality and designCheck on the exact headSha and squash-merges that head. Not the identity that opened or pushed the head.
authority:
  may:
    - Call the forge, tracker, worker, and connector adapters through the references above
    - Review a pull request independently of the identity that opened or pushed its head
    - Read check-runs directly on the exact reviewed head
    - Squash-merge only that exact reviewed head when those check-runs are green
  mustNot:
    - Merge a head that this identity opened or pushed
    - Merge a head other than the exact reviewed head
    - Rebase a head
    - Force-merge when a check on the reviewed head is red
    - Relax a quality gate or grant authority
    - Treat a forge execution identity as a bot
